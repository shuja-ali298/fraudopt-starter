name: Weekly reproducible model build
on:
  schedule:
    - cron: '43 6 * * 0' # UTC Sundays; historical data remains unchanged
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: fraudopt ingest-model
      - run: fraudopt profile
      - run: fraudopt train --capacity-per-day 50
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fraudopt-model-${{ github.run_id }}
          path: |
            outputs/model.joblib
            outputs/model_report.json
            outputs/source_profile.json
            outputs/model_diagnostics.svg
            outputs/calibration_bins.csv
            outputs/precision_recall.csv
            outputs/test_predictions.csv.gz
            data/creditcard_manifest.json
          retention-days: 60
