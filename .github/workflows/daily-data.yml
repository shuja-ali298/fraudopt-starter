name: Daily complaint refresh
on:
  schedule:
    - cron: '17 5 * * *' # UTC, may run late; hosted Actions scheduling is not exact
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fraudopt-complaint-store
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - run: python -m pip install --no-deps -e .
      - run: fraudopt cloud pull
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: fraudopt-data
      - run: fraudopt ingest-complaints --lookback-days 90
      - run: fraudopt cloud push
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: fraudopt-data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complaint-trends-${{ github.run_id }}
          path: |
            outputs/complaint_daily_trends.csv
          retention-days: 30
