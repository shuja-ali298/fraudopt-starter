name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_pages.py'
      - 'scripts/test_pages.js'
      - 'scripts/fetch_dashboard_artifacts.py'
      - 'dashboard_data/**'
      - 'fraudopt/dashboard.py'
      - 'fraudopt/diagnostics.py'
      - 'fraudopt/policy.py'
      - 'requirements-pipeline.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily complaint refresh', 'Weekly reproducible model build']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - name: Fetch trusted dashboard sources
        run: python scripts/fetch_dashboard_artifacts.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/build_pages.py --source _dashboard_inputs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/test_pages.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
